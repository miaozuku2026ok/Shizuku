name: Build Miaozuku APK
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 手动接受Android SDK许可协议，替代setup-android
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346dabd" > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Shizuku Manager Release APK
        run: ./gradlew :manager:assembleRelease

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: Shizuku-ReleaseAPK
          path: manager/build/outputs/apk/release/manager-release-unsigned.apk
